name: Release

# Publishes both packages to npm, publicly, when a version tag is pushed:
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# @lateraltranslucence/cera and create-cera (so a site is `npm create cera`).
# The tag is the version: package.json files in the repository stay at
# 0.0.0, and the release sets both to the tag's version before publishing.
# Only a tag on a commit that's on main is published.
#
# npm sign-in: npm's trusted publishing, configured for both packages on
# npmjs.com for this repository and release.yml. No token or secret: npm
# trades the workflow's OIDC identity for a short-lived one, so the workflow
# sets no NODE_AUTH_TOKEN and no registry-url. Each trusted publisher must
# have "Allow npm publish" ticked: new ones allow only staged publishes, and
# the publish is then refused ("OIDC permission denied for this action").
on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  # For trusted publishing: npm checks the workflow's OIDC identity instead of a token.
  id-token: write

jobs:
  publish:
    name: Check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later; Node 22 comes with npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME isn't a version like v0.3.0 or v0.4.0-beta.1."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Tag a commit that's been merged."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A pre-release (1.0.0-beta.1) is published under the "next" tag, so it's never what `@latest` installs.
          if [[ "$version" == *-* ]]; then echo "dist_tag=next" >> "$GITHUB_OUTPUT"; else echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; fi

      - name: Install
        run: npm ci

      - name: Typecheck and test
        run: npm run check

      - name: Set the version
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --workspaces=false
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --prefix packages/create-cera

      # Builds the package, and the template (from the example site), which
      # pins the new sites' Cera to this version.
      - name: Build
        run: |
          npm run build
          node packages/create-cera/scripts/sync-template.mjs

      - name: Publish @lateraltranslucence/cera
        run: npm publish --access public --tag "${{ steps.version.outputs.dist_tag }}"

      - name: Publish create-cera
        working-directory: packages/create-cera
        run: npm publish --access public --tag "${{ steps.version.outputs.dist_tag }}"
